[package]
name = "clean-optimizer"
version = "0.1.1"
description = "Windows frame-rate optimizer for Delta Force"
authors = ["amangly <amaralkaff@gmail.com>"]
edition = "2021"
default-run = "clean-optimizer"

[lib]
name = "clean_optimizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-opener = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
rfd = "0.15"
ureq = { version = "2.12", features = ["json"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
